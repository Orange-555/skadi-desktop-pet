<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>余额</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      cursor: pointer;
    }
    #total {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      text-shadow:
        0 0 8px rgba(0, 0, 0, 0.85),
        0 1px 3px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>
  <div id="total">--</div>
  <script>
    const el = document.getElementById("total");
    function render(d) {
      if (!d || !d.infos || !d.infos.length) { el.textContent = "--"; return; }
      const p = d.infos[0];
      const s = p.currency === "CNY" ? "¥" : p.currency === "USD" ? "$" : p.currency + " ";
      el.textContent = s + p.total.toFixed(2);
    }
    // 透明浮窗: 仅余额信息, 点击关闭
    document.body.addEventListener("click", () => window.petBridge.dialogAction("close-dialog"));
    window.petBridge.getBalance().then(render);
    window.petBridge.onBalance(render);
  </script>
</body>
</html>
